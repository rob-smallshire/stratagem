name: CI

# Build the disc and run the whole test suite -- the Python models, the
# 6502 programs in py65, and the game in the Beebium emulator on both target
# machines -- on every push to master and every pull request.

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  BEEBASM_VERSION: v1.10

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-24.04          # glibc 2.39: the beebium-server manylinux_2_36 wheel
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6

      # beebasm is not packaged; build it from source once and cache it.
      - name: Cache beebasm
        id: beebasm-cache
        uses: actions/cache@v4
        with:
          path: ~/beebasm/bin
          key: beebasm-${{ env.BEEBASM_VERSION }}-${{ runner.os }}

      - name: Build beebasm
        if: steps.beebasm-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$BEEBASM_VERSION" https://github.com/stardot/beebasm.git ~/beebasm/src
          make -C ~/beebasm/src/src code
          mkdir -p ~/beebasm/bin
          cp "$(find ~/beebasm/src -maxdepth 2 -type f -name beebasm -perm -u+x | head -1)" ~/beebasm/bin/

      - name: Put beebasm on the PATH
        run: |
          echo "$HOME/beebasm/bin" >> "$GITHUB_PATH"
          test -x "$HOME/beebasm/bin/beebasm"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          python-version: "3.13"

      # The default group, dev, includes the tests': Beebium's client and its
      # headless server wheel, which brings the BBC Micro ROMs and presets.
      - name: Install
        run: uv sync --locked

      - name: Build the discs
        run: uv run strat-build

      # Both images: the DFS disc (.ssd) and its ADFS copy (.adl). The game
      # runs from ADFS only where PAGE stays at &1900 or below: not on the
      # B+ or the Integra-B with an ADFS ROM fitted.
      - name: Keep the disc images
        uses: actions/upload-artifact@v4
        with:
          name: disc-images
          path: |
            build/stratagem.ssd
            build/stratagem.adl
          if-no-files-found: error

      - name: Run the tests
        run: uv run pytest -q
