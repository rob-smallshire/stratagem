[project]
name = "stratagem"
version = "0.1.0"
description = "Stratagem -- an open-world building game for the BBC Micro"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "mido>=1.3.3",
    "numpy>=2",
    "oaknut-dfs>=12.18.2",
    "Pillow>=10",
]

[project.scripts]
strat-build = "stratagem.build:main"
strat-lighting-lab = "stratagem.lighting_lab:main"
strat-glide-lab = "stratagem.glide_lab:main"
strat-daylight-lab = "stratagem.daylight_lab:main"
strat-daynight-lab = "stratagem.daynight_lab:main"
strat-chunk-lab = "stratagem.chunk_lab:main"
strat-piece-lab = "stratagem.piece_lab:main"
strat-feature-lab = "stratagem.feature_lab:main"
strat-loading-lab = "stratagem.loading_lab:main"
strat-m5-record = "stratagem.m5_record:main"
strat-m5-master = "stratagem.m5_master:main"
strat-m5-synth = "stratagem.m5_synth:main"
strat-screenshot = "stratagem.screenshot:main"

[dependency-groups]
test = [
    "beebium[imaging]",
    "beebium-server",
    "py65>=1.2",
    "pytest>=8",
    "pytest-timeout>=2",
]
dev = [
    { include-group = "test" },
    "scipy>=1.18.1",
]

# Resolve from public PyPI, whatever the machine's default index, so that
# uv.lock records public URLs.
[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools/stratagem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 300
markers = ["slow: long emulator runs, left out of the quick run (-m \"not slow\")"]
